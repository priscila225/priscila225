<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="300"
  height="165"
  viewBox="0 0 300 165"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Most used languages by commit-weighted share</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #2f80ed;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #434d58;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" height="99%" stroke="#e4e2e2" width="299" fill="#fffefe" stroke-opacity="1"/>
  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
  </g>
  <g transform="translate(25, 40)">
    <mask id="rect-mask">
      <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
    </mask>
    
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="0.00"
          y="0"
          width="97.84"
          height="8"
          fill="#A97BFF"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="97.84"
          y="0"
          width="47.46"
          height="8"
          fill="#662D91"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="145.31"
          y="0"
          width="41.24"
          height="8"
          fill="#3178c6"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="186.55"
          y="0"
          width="29.30"
          height="8"
          fill="#f1e05a"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="215.85"
          y="0"
          width="22.34"
          height="8"
          fill="#f34b7d"
        />
        <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="238.19"
          y="0"
          width="11.81"
          height="8"
          fill="#3572A5"
        />
  </g>
  <g transform="translate(25, 60)">
    <g transform="translate(0, 0)">
      <g transform="translate(0, 0)">
        <g class="stagger" style="animation-delay: 450ms">
          <circle cx="5" cy="6" r="5" fill="#A97BFF" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">Kotlin 39.14%</text>
        </g>
      </g>
      <g transform="translate(0, 25)">
        <g class="stagger" style="animation-delay: 600ms">
          <circle cx="5" cy="6" r="5" fill="#662D91" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">BrightScript 18.98%</text>
        </g>
      </g>
      <g transform="translate(0, 50)">
        <g class="stagger" style="animation-delay: 750ms">
          <circle cx="5" cy="6" r="5" fill="#3178c6" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 16.50%</text>
        </g>
      </g>
      <g transform="translate(150, 0)">
        <g class="stagger" style="animation-delay: 450ms">
          <circle cx="5" cy="6" r="5" fill="#f1e05a" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">JavaScript 11.72%</text>
        </g>
      </g>
      <g transform="translate(150, 25)">
        <g class="stagger" style="animation-delay: 600ms">
          <circle cx="5" cy="6" r="5" fill="#f34b7d" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">C++ 8.94%</text>
        </g>
      </g>
      <g transform="translate(150, 50)">
        <g class="stagger" style="animation-delay: 750ms">
          <circle cx="5" cy="6" r="5" fill="#3572A5" />
          <text data-testid="lang-name" x="15" y="10" class="lang-name">Python 4.72%</text>
        </g>
      </g>
    </g>
  </g>
</svg>

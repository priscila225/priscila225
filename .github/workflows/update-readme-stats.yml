name: Update README stats

on:
  schedule:
    - cron: "0 12 * * *" # daily ~4 AM PT
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=priscila225&include_all_commits=true&show_icons=true&theme=default&hide_border=true
          path: profile/stats-light.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Generate stats (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=priscila225&include_all_commits=true&show_icons=true&theme=transparent&hide_border=true
          path: profile/stats-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate commit-weighted top languages
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/top-langs.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats cards" || exit 0
          git push
